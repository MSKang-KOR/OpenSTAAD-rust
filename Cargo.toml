[package]
name = "openstaad_rust"
version = "0.1.0"
edition = "2024"

[lib]
name = "openstaad_rust"
crate-type = ["cdylib", "rlib"]

[dependencies]
windows = { version = "0.61.3", features = [
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_Foundation",
    "Win32_System_Variant",
] }
windows-core = "0.61.2"
tokio = { version = "1", features = ["full"] }
anyhow = "1.0.98"
notify = { version = "8.1.0", features = ["serde"] }
